[project]
name = "newsletter-agent"
version = "0.1.0"
description = "newsletter-ops 的核心：抓取 → 整理 → Claude 依 news-digest skill 寫報告"
requires-python = ">=3.10"
# 唯一的第三方依賴是 claude-agent-sdk（agent_run 用）；下限是測試過的版本，不是已知的最低相容版本。
# 這個套件不得依賴 notify 或 web（deploy/check_boundaries.py 會檢查）。
dependencies = [
    "claude-agent-sdk>=0.2.123",
    "newsletter-shared",
]

[project.scripts]
newsletter-agent = "newsletter_agent.agent_run:main"
newsletter-fetch = "newsletter_agent.run:main"

[tool.uv.sources]
newsletter-shared = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"
