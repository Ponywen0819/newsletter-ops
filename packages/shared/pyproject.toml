[project]
name = "newsletter-shared"
version = "0.1.0"
description = "newsletter-ops 的共用底層：repo 路徑、報告格式、回饋標記、metrics、OAuth token 儲存"
requires-python = ">=3.10"
# 不得依賴其他 newsletter-* 成員（deploy/check_boundaries.py 會檢查）。
# 程式碼只用標準庫；Windows 沒有系統時區資料庫，zoneinfo 要靠 tzdata 才找得到 Asia/Taipei。
dependencies = [
    "tzdata; sys_platform == 'win32'",
]

[project.scripts]
newsletter-feedback = "newsletter_shared.feedback:main"
newsletter-metrics = "newsletter_shared.metrics:main"
newsletter-report-check = "newsletter_shared.report_data:check"

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
