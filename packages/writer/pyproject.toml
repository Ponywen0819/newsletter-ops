[project]
name = "newsletter-writer"
version = "0.1.0"
description = "newsletter-ops 的寫報告：Claude 依 news-digest skill 把當日 curated JSON 寫成晨報並驗收，不上網"
requires-python = ">=3.10"
# 這個套件不得依賴 collect、notify 或 apps/（deploy/check_boundaries.py 會檢查）：寫報告只讀檔，碰不到抓取。
dependencies = [
    "newsletter-llm",
    "newsletter-shared",
]

[project.scripts]
newsletter-write = "newsletter_writer.write:main"
newsletter-kg = "newsletter_writer.kg:main"

[tool.uv.sources]
newsletter-llm = { path = "../../packages/llm", editable = true }
newsletter-shared = { path = "../../packages/shared", editable = true }

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"
