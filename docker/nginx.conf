# web 前面的閘門：誰連得進來、誰能開 /auth 與 /ops 都在這裡決定，web 本身不做身分驗證。
# 掛到 /etc/nginx/conf.d/default.conf（nginx-unprivileged：非 root、pid 與暫存檔在 /tmp）。
#   8080：只給 cloudflared。身分由 Cloudflare Access 驗過（Tunnel 也要開「驗 Access JWT」），
#         /auth、/ops（授權、手動執行、維運資訊）與它們的 API 一律 404。
#   8788：家裡區網／VPN 直接連。只放行 $lan 的來源，Host 必須是 IP 或 localhost（擋 DNS rebinding），/auth 與 /ops 在這裡。

# 可以開 /auth、/ops 的來源。VPN 的位址不在這些網段時加一行，例如 Tailscale：100.64.0.0/10 1;
geo $lan {
    default         0;
    127.0.0.0/8     1;
    10.0.0.0/8      1;
    172.16.0.0/12   1;
    192.168.0.0/16  1;
    ::1             1;
    fc00::/7        1;
}

# 只認 IP 與 localhost：網域名稱可能被 DNS rebinding 指到區網。要用 raspi.lan 這種名字就加一行
map $host $lan_host {
    default 0;
    ~^(localhost|127\.\d+\.\d+\.\d+|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+)$ 1;
    ~^\[(::1|f[cd][0-9a-f:]*)\]$ 1;
}

# 跨站請求：有 Origin 就要是同一類位址（web 另外只收 application/json 的 POST）
map $http_origin $lan_origin {
    ""      1;
    default 0;
    ~^https?://(localhost|127\.\d+\.\d+\.\d+|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|\[(::1|f[cd][0-9a-f:]*)\])(:\d+)?$ 1;
}

server_tokens off;

server {
    listen 8080;

    # 頁面交給前端顯示「找不到」；API 直接 404
    location ~ ^/(auth|ops)(/|$) {
        rewrite ^ /not-found break;
        proxy_pass http://web:8787;
    }
    location ~ ^/api/(auth|ops)(/|$) {
        default_type application/json;
        return 404 '{"error": "not found"}';
    }
    location = /api/session {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 200 '{"local": false}';
    }
    location / {
        proxy_pass http://web:8787;
    }
}

server {
    listen 8788;

    if ($lan = 0) {
        return 403;
    }
    if ($lan_host = 0) {
        return 421;
    }
    if ($lan_origin = 0) {
        return 403;
    }

    location / {
        proxy_pass http://web:8787;
        proxy_read_timeout 150s;  # 貼 token 時會等 Claude 驗證（最多 90 秒）
    }
}
