[project]
name = "newsletter-ops"
version = "0.1.0"
description = "每日新聞自動蒐集 → 整理 → 報告的 pipeline"
requires-python = ">=3.10"
# 抓取、整理、寄信都只用標準庫；只有 src/agent_run.py（無人值守執行）需要 SDK。
# 下限是測試過的版本，不是已知的最低相容版本。
dependencies = [
    "claude-agent-sdk>=0.2.123",
    "newsletter-shared",
]

[tool.uv]
# 這是一組腳本，不是可安裝的套件：只管環境與依賴，不建置、不安裝專案本身
package = false

# 搬移期間根目錄仍是一般專案；成員搬完後這個檔會只剩下 [tool.uv.workspace]
[tool.uv.workspace]
members = ["shared"]

[tool.uv.sources]
newsletter-shared = { workspace = true }
