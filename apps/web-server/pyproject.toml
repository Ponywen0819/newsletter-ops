[project]
name = "newsletter-web-server"
version = "0.1.0"
description = "newsletter-ops 的網頁後端：JSON API ＋ 提供前端（apps/web-ui）的建置結果"
requires-python = ">=3.10"
# 純標準庫。依賴 shared，以及 llm（只為了 token 驗證：以 `python -m newsletter_llm.runner --auth-check` 呼叫）；
# 不得依賴 notify（deploy/check_boundaries.py 會檢查）。
dependencies = [
    "newsletter-shared",
    "newsletter-llm",
]

[project.scripts]
newsletter-web = "newsletter_web_server.web:main"

[tool.uv.sources]
newsletter-shared = { path = "../../packages/shared", editable = true }
newsletter-llm = { path = "../../packages/llm", editable = true }

[build-system]
requires = ["uv_build>=0.11.13,<0.12"]
build-backend = "uv_build"
