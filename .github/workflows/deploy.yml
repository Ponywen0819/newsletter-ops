name: deploy

# 重新部署或退版：Actions → deploy → Run workflow，填版本號（那個 tag 要已經建過映像、而且有 deploy/deploy.sh）。
# 實際的 ssh 部署在 service-core 的共用 workflow（見 service-core 的 deploy/README.md）；打 tag 時的自動部署由 release.yml 呼叫同一個。
# 手動觸發的 workflow 要在 repo 的預設分支（main）上才看得到。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 要部署的版本（vX.Y.Z）
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    uses: Ponywen0819/service-core/.github/workflows/deploy.yml@main
    with:
      tag: ${{ inputs.tag }}
      host: ${{ vars.DEPLOY_HOST }}
    secrets:
      ssh_key: ${{ secrets.DEPLOY_SSH_KEY }}
