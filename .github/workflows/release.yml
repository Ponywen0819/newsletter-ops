name: release

# main 或 v* tag 的 selftest 通過後，建 web、worker 兩個映像推到 GHCR：main 打 latest，tag 打同名版本號
on:
  workflow_run:
    workflows: [selftest]
    types: [completed]
    branches: [main, 'v*']   # tag push 時 head_branch 是 tag 名稱

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ponywen0819/newsletter-ops   # GHCR 只能小寫；實際是 -web、-worker 兩個

jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    # 自架 runner 是 x64，arm64 映像靠 QEMU 模擬建置（比原生慢）
    runs-on: [self-hosted, linux, x64, docker]
    strategy:
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}-${{ matrix.target }}:${{ github.event.workflow_run.head_branch == 'main' && 'latest' || github.event.workflow_run.head_branch }}
            ${{ env.IMAGE }}-${{ matrix.target }}:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
