name: release

# main 的 selftest 通過後，建 web、worker 兩個映像推到 GHCR
on:
  workflow_run:
    workflows: [selftest]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ponywen0819/newsletter-ops   # GHCR 只能小寫；實際是 -web、-worker 兩個

jobs:
  image:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}-${{ matrix.target }}:latest
            ${{ env.IMAGE }}-${{ matrix.target }}:sha-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
