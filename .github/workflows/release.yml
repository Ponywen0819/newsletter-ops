name: release

# 在 main 打 v* tag 時建一次 web、worker 兩個映像推到 GHCR，同一個映像打上版本號、latest、sha（selftest 已在 PR 跑過）
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ponywen0819/newsletter-ops   # GHCR 只能小寫；實際是 -web、-worker 兩個

jobs:
  image:
    # 自架 runner 是 x64，arm64 映像靠 QEMU 模擬建置（比原生慢）
    runs-on: [self-hosted, linux, x64, docker]
    strategy:
      matrix:
        target: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}-${{ matrix.target }}:${{ github.ref_name }}
            ${{ env.IMAGE }}-${{ matrix.target }}:latest
            ${{ env.IMAGE }}-${{ matrix.target }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
