name: tunnel-sync

# deploy/cloudflare-tunnel.json 是正式區 Cloudflare Tunnel 路由的唯一來源（見 deploy/README.md「Tunnel 設定進版控」）
# PR 到 develop／main：驗檔案、與線上比對；main 更新後才套用（PUT 整份設定、補 DNS CNAME）
on:
  pull_request:
    branches: [develop, main]
    paths: [deploy/cloudflare-tunnel.json, deploy/tunnel-sync.sh, .github/workflows/tunnel-sync.yml]
  push:
    branches: [main]
    paths: [deploy/cloudflare-tunnel.json, deploy/tunnel-sync.sh, .github/workflows/tunnel-sync.yml]
  workflow_dispatch:   # 在 main 上手動跑會套用；其他分支只比對

permissions:
  contents: read

concurrency:
  group: tunnel-sync
  cancel-in-progress: false

jobs:
  sync:
    # 自架 runner（和 selftest 一樣）。repo 是公開的：fork 來的 PR 不在這台跑
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID }}
      CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4

      # runner 上不一定有 jq：沒有就下載固定版本到這次工作的暫存目錄（不動系統）
      - name: Ensure jq
        run: |
          command -v jq >/dev/null && exit 0
          curl -fsSL -o "$RUNNER_TEMP/jq" https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64
          chmod +x "$RUNNER_TEMP/jq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Check
        run: bash deploy/tunnel-sync.sh check

      # secrets 還沒設定時只做上面的離線檢查
      - name: Diff against live
        if: env.CF_API_TOKEN != ''
        run: bash deploy/tunnel-sync.sh diff

      - name: Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: bash deploy/tunnel-sync.sh apply
