name: selftest

# 各模組的 lint、自我檢查（不連網）、前端測試都交給 Nx；PR 到 develop／main 時檢查，main 的 push 之後 release.yml 接著建映像
on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    env:
      NX_NO_CLOUD: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      # setup-uv 沒有浮動的主版本 tag
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.13"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web-ui/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: apps/web-ui
      - run: npx nx run-many -t lint selftest typecheck test
      - run: git ls-files '*.sh' | xargs shellcheck --severity=warning
      - run: uv run --no-project python deploy/check_boundaries.py --selftest
      - run: uv run --no-project python deploy/check_boundaries.py
