name: selftest

# 各模組的自我檢查，不連網
on: push

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      # setup-uv 沒有浮動的主版本 tag
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m newsletter_agent.curate
      - run: uv run --locked python -m newsletter_agent.fetch
      - run: uv run --locked newsletter-metrics --selftest
      - run: uv run --locked newsletter-render --selftest
      - run: uv run --locked newsletter-send --selftest
      - run: uv run --locked newsletter-feedback --selftest
      - run: uv run --locked python -m newsletter_shared.lock --selftest
      - run: uv run --locked python -m newsletter_shared.auth_store --selftest
      - run: uv run --locked python -m newsletter_shared.report_data --selftest
      - run: uv run --locked newsletter-web --selftest
      - run: uv run --locked newsletter-run --selftest
      - run: uv run --locked newsletter-fetch --list-sources
      - run: python3 deploy/check_boundaries.py --selftest
      - run: python3 deploy/check_boundaries.py
