name: selftest

# 各模組的自我檢查都只用標準庫、不連網。用 uv 把 workspace 裝好（含 claude-agent-sdk，鎖檔決定版本），
# 但 agent_run.py 的自我檢查與前端的 npm test 仍不在這裡跑。
on: push

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      # setup-uv 沒有 v10 這種浮動 tag，要釘完整版本；uv 版本與 Dockerfile、本機一致
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.13"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m newsletter_agent.curate
      - run: uv run --locked python -m newsletter_agent.fetch
      - run: uv run --locked newsletter-metrics --selftest
      - run: uv run --locked python src/render_email.py --selftest
      - run: uv run --locked python src/send_email.py --selftest
      - run: uv run --locked newsletter-feedback --selftest
      - run: uv run --locked python -m newsletter_shared.auth_store --selftest
      - run: uv run --locked python -m newsletter_shared.report_data --selftest
      - run: uv run --locked python src/web.py --selftest
      - run: uv run --locked newsletter-fetch --list-sources
      - run: python3 deploy/check_boundaries.py --selftest
      - run: python3 deploy/check_boundaries.py
