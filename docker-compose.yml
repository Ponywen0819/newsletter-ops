# 說明見 deploy/README.md。機密放 .env（chmod 600）。
name: newsletter-ops

# 同一個 Dockerfile 的兩個 target；兩個映像同一次建置、同一個 tag
x-app: &app
  restart: unless-stopped
  init: true
  volumes:
    - newsletter-data:/var/lib/newsletter

services:
  web:
    <<: *app
    build: {context: ., target: web}
    image: ghcr.io/ponywen0819/newsletter-ops-web:${NEWSLETTER_TAG:-latest}
    # 不要 publish 8787（會繞過 Access）；8788 只能綁 127.0.0.1（/auth 沒有登入）
    command: ["newsletter-web", "--host", "0.0.0.0", "--port", "8787", "--admin-port", "8788"]
    ports:
      - "127.0.0.1:8788:8788"
    # 用 CMD-SHELL：podman 會把 CMD 陣列裡含空格的參數拆開
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8787/reports', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    build: {context: ., target: worker}
    image: ghcr.io/ponywen0819/newsletter-ops-worker:${NEWSLETTER_TAG:-latest}
    # 映像的 CMD 是 worker --port 8790：每天 NEWSLETTER_RUN_AT 跑一次、啟動時補跑今天錯過的；/status、/run 不 publish，只在 be 網路
    networks: [be]
    # 停止時要等執行中的步驟收尾、寫好紀錄
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8790/status', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      GMAIL_USER: ${GMAIL_USER:?請在 .env 設定 GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:?請在 .env 設定 GMAIL_APP_PASSWORD}
      NEWSLETTER_MAIL_TO: ${NEWSLETTER_MAIL_TO:-${GMAIL_USER}}
      NEWSLETTER_RUN_AT: ${NEWSLETTER_RUN_AT:-08:00}
      NEWSLETTER_BASE_URL: ${NEWSLETTER_BASE_URL:-}

  cloudflared:
    image: cloudflare/cloudflared:latest
    # QUIC 在家用網路上會定期斷線，改用 http2
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?請在 .env 設定 TUNNEL_TOKEN（Cloudflare Zero Trust 建立 Tunnel 時取得）}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  newsletter-data:

networks:
  # 只有 worker：web 沒有登入、cloudflared 對外，都不該連得到 /run
  be:
