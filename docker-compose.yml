# 說明見 deploy/README.md。機密放 .env（chmod 600）。
# 這裡只有服務本身（web、worker）。對外入口（Cloudflare Tunnel、nginx）在 service-core repo 的 gateway，不在這個 repo。
name: newsletter-ops

# 同一個 Dockerfile 的兩個 target；兩個映像同一次建置、同一個 tag
x-app: &app
  restart: unless-stopped
  init: true
  volumes:
    - newsletter-data:/var/lib/newsletter
  # 只有 volume、/tmp 與家目錄（claude CLI 的設定與 session 紀錄）可寫；不需要任何 capability
  read_only: true
  tmpfs: [/tmp, "/home/app:mode=1777"]  # 不給 mode 時 compose 建出來是 root 的 755，app 寫不進去（podman 不收 uid=）
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]

services:
  web:
    <<: *app
    build: {context: ., target: web}
    image: ghcr.io/ponywen0819/newsletter-ops-web:${NEWSLETTER_TAG:-latest}
    # 不做身分驗證：不 publish，只讓入口閘門連。閘門由 service-core 的 gateway 提供，它建立 gw-newsletter 網路、
    # 用別名 newsletter-web 連進來；閘門要做到的事見 deploy/README.md「入口閘門的約定」。
    # 也在 be 網路：維運頁（/ops，閘門只在區網入口放行）呼叫 worker 的 /status、/run、/job
    command: ["newsletter-web", "--host", "0.0.0.0", "--port", "8787"]
    networks:
      gw-newsletter: {aliases: [newsletter-web]}
      be: {}
    environment:
      NEWSLETTER_WORKER_URL: http://worker:8790
      # Postgres 若在 host 本機，容器內不能用 127.0.0.1，要用 host 的區網 IP 或 host.docker.internal／host.containers.internal
      NEWSLETTER_DATABASE_URL: ${NEWSLETTER_DATABASE_URL:?請在 .env 設定 NEWSLETTER_DATABASE_URL（Postgres 連線字串）}
    # 用 CMD-SHELL：podman 會把 CMD 陣列裡含空格的參數拆開
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8787/reports', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    build: {context: ., target: worker}
    image: ghcr.io/ponywen0819/newsletter-ops-worker:${NEWSLETTER_TAG:-latest}
    # 映像的 CMD 是 worker --port 8790：每天 NEWSLETTER_RUN_AT 跑一次、啟動時補跑今天錯過的；/status、/run、/job 不 publish，只在 be 網路
    networks: [be]
    # 停止時要等執行中的步驟收尾、寫好紀錄
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8790/status', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      GMAIL_USER: ${GMAIL_USER:?請在 .env 設定 GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:?請在 .env 設定 GMAIL_APP_PASSWORD}
      # Postgres 若在 host 本機，容器內不能用 127.0.0.1，要用 host 的區網 IP 或 host.docker.internal／host.containers.internal
      NEWSLETTER_DATABASE_URL: ${NEWSLETTER_DATABASE_URL:?請在 .env 設定 NEWSLETTER_DATABASE_URL（Postgres 連線字串）}
      NEWSLETTER_MAIL_TO: ${NEWSLETTER_MAIL_TO:-${GMAIL_USER}}
      NEWSLETTER_RUN_AT: ${NEWSLETTER_RUN_AT:-08:00}
      NEWSLETTER_ROUNDS: ${NEWSLETTER_ROUNDS-13:00,18:00,23:00}
      NEWSLETTER_AUTH_CHECK_AT: ${NEWSLETTER_AUTH_CHECK_AT:-07:30}
      NEWSLETTER_BASE_URL: ${NEWSLETTER_BASE_URL:-}
      NEWSLETTER_HEARTBEAT_URL: ${NEWSLETTER_HEARTBEAT_URL:-}

volumes:
  newsletter-data:

networks:
  # worker 與 web：/run、/job 會用額度、寄信，閘門碰不到（worker 不在 gw-newsletter）。
  # web 連得到（維運頁），所以「誰能觸發」由閘門決定：/ops、/api/ops* 只在區網入口放行。
  # web 需要對外（驗 token 時呼叫 Claude），所以不設 internal
  be:
  # 閘門 ↔ web：由 service-core 的 gateway 建立（固定名稱與子網），所以 gateway 要先部署；不存在時 compose up 會直接失敗
  gw-newsletter:
    external: true
