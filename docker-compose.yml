# 三個容器、一個 volume：
#   web         晨報網頁（沒有登入；主 port 不 publish，只有這個 compose 網路上的容器連得到。
#               另有管理 port 8788，只 publish 成 host 的 127.0.0.1，給貼 OAuth token 用）
#   scheduler   每天 08:00 跑 run_daily.sh → newsletter-run（抓取 → agent 寫報告 → 寄信；整條握一把防重疊的鎖）
#   cloudflared 出站連到 Cloudflare，再轉給 http://web:8787；Access 是唯一的防線
# 機密放 .env（從 .env.example 複製，chmod 600，不進版控）。

name: newsletter-ops

x-app: &app
  build: .
  image: ghcr.io/ponywen0819/newsletter-ops:${NEWSLETTER_TAG:-latest}
  restart: unless-stopped
  init: true
  volumes:
    - newsletter-data:/var/lib/newsletter   # reports/、data/、state/、logs/

services:
  web:
    <<: *app
    # 容器自己的網路空間裡綁 0.0.0.0（web.py 會印一行警告，可忽略）：主 port 8787 沒有 ports:，容器外只有 cloudflared 連得到。
    # 不要為了從 host 直接開而 publish 8787，那會繞過 Access。
    # 不載入任何環境機密：網頁程序拿不到 Gmail 帳密。OAuth token 存在 volume 的 state/oauth_token.json（web 驗證並儲存它，scheduler 讀它）。
    # 管理 port 8788：/auth（貼 OAuth token）只在這個 listener 開，主 port 上永遠是 404。host 本機的瀏覽器開
    # http://127.0.0.1:8788/auth 貼上（見 deploy/README.md「貼上 OAuth token」）。它沒有登入，靠只綁 127.0.0.1 擋人：
    # 不要改成 "8788:8788"（會對區網開放），也不要放進 Tunnel 的 Public Hostname（Tunnel 只指向 web:8787）。
    command: ["newsletter-web", "--host", "0.0.0.0", "--port", "8787", "--admin-port", "8788"]
    ports:
      - "127.0.0.1:8788:8788"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8787/reports', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    <<: *app
    command: ["/app/docker/scheduler.sh"]
    environment:
      GMAIL_USER: ${GMAIL_USER:?請在 .env 設定 GMAIL_USER}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:?請在 .env 設定 GMAIL_APP_PASSWORD}
      NEWSLETTER_MAIL_TO: ${NEWSLETTER_MAIL_TO:-${GMAIL_USER}}   # 沒設就寄給自己
      NEWSLETTER_RUN_AT: ${NEWSLETTER_RUN_AT:-08:00}
      NEWSLETTER_BASE_URL: ${NEWSLETTER_BASE_URL:-}   # 有設，email 才有 👍／👎 連結

  cloudflared:
    image: cloudflare/cloudflared:latest
    # 強制 http2（TCP）：預設的 QUIC（UDP）在 Docker Desktop／家用網路上每 10 分鐘左右逾時斷線重連
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?請在 .env 設定 TUNNEL_TOKEN（Cloudflare Zero Trust 建立 Tunnel 時取得）}
    # Tunnel 的 Public Hostname 要填的 Service 是 http://web:8787
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  newsletter-data:
